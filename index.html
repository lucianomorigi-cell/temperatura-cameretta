<section class="status-card">
  <h2>Climatizzatore</h2>

  <div class="details">
    <p>Stato: <strong id="powerState">SPENTO</strong></p>
  </div>

  <button id="powerButton">ACCENDI</button>

  <hr style="margin:25px 0;border:1px solid rgba(255,255,255,.08)">

  <h3>Modalità automatica</h3>

  <label>
    <input type="checkbox" id="autoMode">
    Attiva controllo automatico
  </label>

  <div style="margin-top:20px">

    <label for="tempOn">Accendi sopra</label><br>
    <input
      id="tempOn"
      type="number"
      step="0.5"
      min="15"
      max="35"
      value="26">

    °C
  </div>

  <div style="margin-top:15px">

    <label for="tempOff">Spegni sotto</label><br>
    <input
      id="tempOff"
      type="number"
      step="0.5"
      min="15"
      max="35"
      value="24">

    °C
  </div>

  <button
      id="saveSettings"
      style="margin-top:25px">
      SALVA IMPOSTAZIONI
  </button>

</section>
